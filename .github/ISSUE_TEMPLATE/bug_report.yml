name: Bug report
description: Report a reproducible problem in the DUR prototype
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include bot tokens, private keys, seed phrases, or personal data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Android / Telegram version / browser
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redact secrets)
