name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: dur-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency audit findings
        run: npm audit --json > /tmp/dur-npm-audit.json || true; node -e "const a=require('/tmp/dur-npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities ?? {}, null, 2))"
      - run: npm run build
      - run: npm test
