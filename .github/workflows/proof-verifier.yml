name: TON Proof Verifier

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: proof-verifier-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test Secure Proof Verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: proof-verifier/go.mod
      - name: Resolve modules
        working-directory: proof-verifier
        run: go mod tidy
      - name: Test verifier
        working-directory: proof-verifier
        run: go test -race ./...
      - name: Vet verifier
        working-directory: proof-verifier
        run: go vet ./...
      - name: Build verifier
        working-directory: proof-verifier
        run: go build -trimpath -ldflags="-s -w" -o ../bin/dur-proof-verifier .
