services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      API_PORT: "8787"
      DUR_DATABASE_PATH: /data/dur.sqlite
      DUR_PROOF_VERIFIER_BIN: /app/bin/dur-proof-verifier
      TRUSTED_PROXY_IPS: 172.30.0.2
    expose:
      - "8787"
    volumes:
      - dur-data:/data
    networks:
      dur-net:
        ipv4_address: 172.30.0.3
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_TONCONNECT_MANIFEST_URL: ${VITE_TONCONNECT_MANIFEST_URL:?Set VITE_TONCONNECT_MANIFEST_URL in .env}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      dur-net:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "indexer:worker"]
    env_file: .env
    environment:
      DUR_DATABASE_PATH: /data/dur.sqlite
      DUR_PROOF_VERIFIER_BIN: /app/bin/dur-proof-verifier
    volumes:
      - dur-data:/data
    networks:
      - dur-net
    depends_on:
      api:
        condition: service_healthy
    profiles: ["indexer"]
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "bot"]
    env_file: .env
    networks:
      - dur-net
    depends_on:
      api:
        condition: service_healthy
    profiles: ["telegram"]
    restart: unless-stopped

volumes:
  dur-data:
  caddy-data:
  caddy-config:

networks:
  dur-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
