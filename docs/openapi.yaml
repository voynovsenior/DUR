openapi: 3.1.0
info:
  title: DUR API
  version: 0.3.0
  description: Development preview API. Identity, attestations, consent, manual Testnet indexing and an experimental attestation-based reputation projection are implemented; escrow is not.
servers:
  - url: http://localhost:8787
paths:
  /healthz:
    get:
      summary: Service health
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok: { type: boolean, const: true }
                  service: { type: string, const: dur-api }
                  version: { type: string, example: 0.3.0 }
  /v1/status:
    get:
      summary: Protocol capability status
      responses:
        '200':
          description: Explicit availability of planned modules
          content:
            application/json:
              schema:
                type: object
                required: [protocol, version, environment, network, capabilities]
                properties:
                  protocol: { type: string, const: DUR }
                  version: { type: string }
                  environment: { type: string }
                  network: { type: string }
                  capabilities:
                    type: object
                    properties:
                      reputation: { type: string, const: experimental_attestation_projection_v0.1 }
                      attestations: { type: string, const: issuer_registry_available }
                      escrow: { type: string, const: not_implemented }
                      chainIndexing: { type: string, const: manual_testnet_sync_available }
  /v1/issuers:
    get:
      summary: List active issuers
      responses:
        '200':
          description: Public issuer directory
  /v1/schemas:
    get:
      summary: List active attestation schema versions
      responses:
        '200':
          description: Public schema directory
  /v1/auth/consents:
    get:
      summary: List consent grants owned by the authenticated user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Consent grants for the current account
        '401':
          description: Authentication required
    post:
      summary: Grant an issuer permission to attest a linked wallet under one schema
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress, issuerId, schemaId, schemaVersion, purpose]
              properties:
                walletAddress: { type: string }
                issuerId: { type: string }
                schemaId: { type: string }
                schemaVersion: { type: integer, minimum: 1 }
                purpose: { type: string, minLength: 5, maxLength: 256 }
                expiresAt: { type: integer }
      responses:
        '201':
          description: Consent grant created
        '403':
          description: Wallet is not linked to the authenticated account
  /v1/auth/consents/{id}/revoke:
    post:
      summary: Revoke a consent grant owned by the authenticated user
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Consent revoked
        '404':
          description: Consent not found or already revoked
  /v1/admin/schemas:
    post:
      summary: Register an immutable attestation JSON Schema version
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaId, schemaVersion, schema]
              properties:
                schemaId: { type: string }
                schemaVersion: { type: integer, minimum: 1 }
                schema: { type: object }
      responses:
        '201':
          description: Schema version registered
        '400':
          description: Invalid or duplicate schema version
  /v1/admin/issuers/{id}/status:
    post:
      summary: Suspend, reactivate or revoke an issuer
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, revoked] }
      responses:
        '200':
          description: Issuer status updated
        '404':
          description: Issuer not found or already terminally revoked
  /v1/schemas/{schemaId}/{version}:
    get:
      summary: Retrieve a registered attestation schema
      parameters:
        - name: schemaId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Registered JSON Schema
        '404':
          description: Schema version not found
  /v1/indexer/status:
    get:
      summary: Testnet indexer checkpoint status
      responses:
        '200':
          description: Manual ingestion checkpoint and explicit provider trust boundary
          content:
            application/json:
              schema:
                type: object
                required: [network, mode, checkpoint, trust]
                properties:
                  network: { type: string, const: ton-testnet }
                  mode: { type: string, const: manual_sync }
                  checkpoint:
                    oneOf:
                      - type: object
                        required: [network, seqno, rootHash, fileHash]
                        properties:
                          network: { type: string }
                          seqno: { type: integer }
                          rootHash: { type: string }
                          fileHash: { type: string }
                      - type: 'null'
                  trust: { type: string, const: provider_indexed_data_unverified }
  /v1/indexer/events:
    get:
      summary: List recent indexed Testnet events
      parameters:
        - name: network
          in: query
          schema: { type: string, enum: [ton-testnet], default: ton-testnet }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [verified, unverified, quarantined] }
      responses:
        '200':
          description: Indexed events; provider data is explicitly unverified
          content:
            application/json:
              schema:
                type: object
                required: [network, events, trust]
                properties:
                  network: { type: string, const: ton-testnet }
                  events: { type: array, items: { type: object } }
                  trust: { type: string, const: provider_indexed_data_unverified }
        '400':
          description: Invalid network or query filter
  /v1/admin/issuers/{id}/trust-tier:
    post:
      summary: Set an issuer trust tier with an audit reason
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trustTier, reason]
              properties:
                trustTier: { type: string, enum: [unverified, verified, trusted, official] }
                reason: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Trust tier updated and audit event recorded
        '400':
          description: Invalid trust tier or reason
        '401':
          description: Admin authentication required
        '404':
          description: Issuer not found
  /v1/profiles/{subjectId}/reputation:
    get:
      summary: Retrieve the caller's experimental reputation projection for a linked wallet
      security:
        - SessionCookie: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, pattern: '^wallet:-3:0:[a-fA-F0-9]{64}$' }
      responses:
        '200':
          description: Versioned reputation projection with dimensions, evidence coverage and limitations
        '400':
          description: Invalid subject identifier
        '401':
          description: Telegram session required
        '403':
          description: Subject wallet is not linked to the authenticated account
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
    SessionCookie:
      type: apiKey
      in: cookie
      name: dur_session
